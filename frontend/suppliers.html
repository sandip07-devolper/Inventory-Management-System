<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suppliers · Inventory & Order Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <div id="navbarContainer"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Suppliers</h1>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#supplierModal" id="addSupplierBtn">
        + Add Supplier
      </button>
    </div>

    <div id="suppliersError" class="alert alert-danger d-none" role="alert"></div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Contact</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="suppliersTableBody">
            <tr>
              <td colspan="6" class="text-center text-muted py-4">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Create / Edit modal -->
  <div class="modal fade" id="supplierModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="supplierForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="supplierModalTitle">Add Supplier</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="supplierFormError" class="alert alert-danger d-none" role="alert"></div>

            <input type="hidden" id="supplierId" />

            <div class="mb-3">
              <label for="supplierName" class="form-label">Name</label>
              <input type="text" class="form-control" id="supplierName" required maxlength="150" />
            </div>
            <div class="mb-3">
              <label for="contactPerson" class="form-label">Contact person</label>
              <input type="text" class="form-control" id="contactPerson" maxlength="100" />
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label for="supplierEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="supplierEmail" maxlength="256" />
              </div>
              <div class="col-6 mb-3">
                <label for="supplierPhone" class="form-label">Phone</label>
                <input type="text" class="form-control" id="supplierPhone" maxlength="30" />
              </div>
            </div>
            <div class="mb-3">
              <label for="supplierAddress" class="form-label">Address</label>
              <textarea class="form-control" id="supplierAddress" rows="2" maxlength="300"></textarea>
            </div>
            <div class="form-check" id="supplierIsActiveContainer" style="display: none">
              <input type="checkbox" class="form-check-input" id="supplierIsActive" checked />
              <label class="form-check-label" for="supplierIsActive">Active</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/suppliers.js"></script>
</body>
</html>
