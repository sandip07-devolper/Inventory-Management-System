<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Users · Inventory & Order Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <div id="navbarContainer"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Users</h1>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" id="addUserBtn">
        + Add User
      </button>
    </div>

    <div id="usersError" class="alert alert-danger d-none" role="alert"></div>
    <div id="accessDenied" class="alert alert-warning d-none" role="alert">
      You need Admin access to manage users.
    </div>

    <div class="card" id="usersCard">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr>
              <td colspan="5" class="text-center text-muted py-4">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Create / Edit modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="userForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="userModalTitle">Add User</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="userFormError" class="alert alert-danger d-none" role="alert"></div>

            <input type="hidden" id="userId" />

            <div class="mb-3">
              <label for="userFullName" class="form-label">Full name</label>
              <input type="text" class="form-control" id="userFullName" required maxlength="100" />
            </div>
            <div class="mb-3">
              <label for="userEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="userEmail" required maxlength="256" />
              <div class="form-text" id="emailLockedHint" style="display: none">
                Email can't be changed after the account is created.
              </div>
            </div>
            <div class="mb-3" id="userPasswordContainer">
              <label for="userPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="userPassword" minlength="8" />
              <div class="form-text">At least 8 characters.</div>
            </div>
            <div class="mb-3">
              <label for="userRole" class="form-label">Role</label>
              <select class="form-select" id="userRole" required>
                <option value="Staff">Staff</option>
                <option value="Admin">Admin</option>
              </select>
            </div>
            <div class="form-check" id="userIsActiveContainer" style="display: none">
              <input type="checkbox" class="form-check-input" id="userIsActive" checked />
              <label class="form-check-label" for="userIsActive">Active</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/users.js"></script>
</body>
</html>
