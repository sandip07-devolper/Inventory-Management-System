<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Purchase Orders · Inventory & Order Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <div id="navbarContainer"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Purchase Orders</h1>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createOrderModal" id="addOrderBtn">
        + New Purchase Order
      </button>
    </div>

    <div id="ordersError" class="alert alert-danger d-none" role="alert"></div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label small text-muted mb-1">Status</label>
            <select id="statusFilter" class="form-select">
              <option value="">All</option>
              <option value="Draft">Draft</option>
              <option value="Received">Received</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Order #</th>
              <th>Supplier</th>
              <th>Status</th>
              <th>Order Date</th>
              <th class="text-end">Total</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody">
            <tr>
              <td colspan="6" class="text-center text-muted py-4">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="card-footer bg-white d-flex justify-content-between align-items-center">
        <span id="resultsSummary" class="text-muted small"></span>
        <nav>
          <ul id="pagination" class="pagination pagination-sm mb-0"></ul>
        </nav>
      </div>
    </div>
  </div>

  <!-- Create modal -->
  <div class="modal fade" id="createOrderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="createOrderForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title">New Purchase Order</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="createOrderError" class="alert alert-danger d-none" role="alert"></div>

            <div class="mb-3">
              <label for="orderSupplierId" class="form-label">Supplier</label>
              <select class="form-select" id="orderSupplierId" required>
                <option value="" disabled selected>Choose a supplier…</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="orderNotes" class="form-label">Notes (optional)</label>
              <textarea class="form-control" id="orderNotes" rows="2" maxlength="500"></textarea>
            </div>

            <label class="form-label">Line items</label>
            <table class="table table-sm align-middle">
              <thead>
                <tr>
                  <th>Product</th>
                  <th style="width: 110px">Quantity</th>
                  <th style="width: 130px">Unit Cost</th>
                  <th style="width: 40px"></th>
                </tr>
              </thead>
              <tbody id="orderItemsBody"></tbody>
            </table>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="addItemRowBtn">+ Add item</button>
            <div class="text-end mt-2">
              <strong>Total: <span id="orderTotalPreview">$0.00</span></strong>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Create Draft Order</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View / manage modal -->
  <div class="modal fade" id="viewOrderModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="viewOrderTitle">Purchase Order</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="viewOrderError" class="alert alert-danger d-none" role="alert"></div>
          <div id="viewOrderBody"></div>
        </div>
        <div class="modal-footer" id="viewOrderActions"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/pagination.js"></script>
  <script src="assets/js/purchase-orders.js"></script>
</body>
</html>
