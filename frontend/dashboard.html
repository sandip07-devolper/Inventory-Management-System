<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · Inventory & Order Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <div id="navbarContainer"></div>

  <div class="container py-4">
    <div id="dashboardError" class="alert alert-danger d-none" role="alert"></div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3">
        <div class="card kpi-card">
          <div class="card-body">
            <div class="kpi-label">Low stock items</div>
            <div class="kpi-value" id="lowStockCount">–</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card kpi-card">
          <div class="card-body">
            <div class="kpi-label">Units on hand</div>
            <div class="kpi-value" id="unitsOnHand">–</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card kpi-card">
          <div class="card-body">
            <div class="kpi-label">Inventory cost value</div>
            <div class="kpi-value" id="inventoryCostValue">–</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card kpi-card">
          <div class="card-body">
            <div class="kpi-label">Inventory retail value</div>
            <div class="kpi-value" id="inventoryRetailValue">–</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header bg-white">
        <strong>Products at or below reorder level</strong>
      </div>
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>SKU</th>
              <th>Product</th>
              <th>Category</th>
              <th>On hand / Reorder</th>
            </tr>
          </thead>
          <tbody id="lowStockTableBody">
            <tr>
              <td colspan="4" class="text-center text-muted py-4">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
