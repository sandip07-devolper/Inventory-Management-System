<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customers · Inventory & Order Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <div id="navbarContainer"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Customers</h1>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#customerModal" id="addCustomerBtn">
        + Add Customer
      </button>
    </div>

    <div id="customersError" class="alert alert-danger d-none" role="alert"></div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="customersTableBody">
            <tr>
              <td colspan="5" class="text-center text-muted py-4">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Create / Edit modal -->
  <div class="modal fade" id="customerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="customerForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="customerModalTitle">Add Customer</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="customerFormError" class="alert alert-danger d-none" role="alert"></div>

            <input type="hidden" id="customerId" />

            <div class="mb-3">
              <label for="customerName" class="form-label">Name</label>
              <input type="text" class="form-control" id="customerName" required maxlength="150" />
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label for="customerEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="customerEmail" maxlength="256" />
              </div>
              <div class="col-6 mb-3">
                <label for="customerPhone" class="form-label">Phone</label>
                <input type="text" class="form-control" id="customerPhone" maxlength="30" />
              </div>
            </div>
            <div class="mb-3">
              <label for="customerAddress" class="form-label">Address</label>
              <textarea class="form-control" id="customerAddress" rows="2" maxlength="300"></textarea>
            </div>
            <div class="form-check" id="customerIsActiveContainer" style="display: none">
              <input type="checkbox" class="form-check-input" id="customerIsActive" checked />
              <label class="form-check-label" for="customerIsActive">Active</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/customers.js"></script>
</body>
</html>
