<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Inventory & Order Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Sign in</h1>
        <p class="text-muted mb-4">Inventory & Order Management System</p>

        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required autocomplete="username" />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign in</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0">
          No account yet? <a href="register.html">Register your organization</a>
        </p>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
