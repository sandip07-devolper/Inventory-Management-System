<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products · Inventory & Order Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <div id="navbarContainer"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Products</h1>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" id="addProductBtn">
        + Add Product
      </button>
    </div>

    <div id="productsError" class="alert alert-danger d-none" role="alert"></div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label small text-muted mb-1">Search</label>
            <input type="text" id="searchInput" class="form-control" placeholder="Name or SKU..." />
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted mb-1">Category</label>
            <select id="categoryFilter" class="form-select">
              <option value="">All categories</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label small text-muted mb-1">Status</label>
            <select id="statusFilter" class="form-select">
              <option value="">All</option>
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select>
          </div>
          <div class="col-md-2">
            <button id="clearFiltersBtn" class="btn btn-outline-secondary w-100">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>SKU</th>
              <th>Name</th>
              <th>Category</th>
              <th class="text-end">Unit Price</th>
              <th class="text-end">On Hand</th>
              <th>Status</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr>
              <td colspan="7" class="text-center text-muted py-4">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="card-footer bg-white d-flex justify-content-between align-items-center">
        <span id="resultsSummary" class="text-muted small"></span>
        <nav>
          <ul id="pagination" class="pagination pagination-sm mb-0"></ul>
        </nav>
      </div>
    </div>
  </div>

  <!-- Create / Edit modal -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="productForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="productModalTitle">Add Product</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="productFormError" class="alert alert-danger d-none" role="alert"></div>

            <input type="hidden" id="productId" />

            <div class="mb-3">
              <label for="sku" class="form-label">SKU</label>
              <input type="text" class="form-control" id="sku" required maxlength="50" />
            </div>
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" required maxlength="150" />
            </div>
            <div class="mb-3">
              <label for="categoryId" class="form-label">Category</label>
              <select class="form-select" id="categoryId" required>
                <option value="" disabled selected>Choose a category…</option>
              </select>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label for="unitPrice" class="form-label">Unit price</label>
                <input type="number" step="0.01" min="0" class="form-control" id="unitPrice" required />
              </div>
              <div class="col-6 mb-3">
                <label for="costPrice" class="form-label">Cost price</label>
                <input type="number" step="0.01" min="0" class="form-control" id="costPrice" required />
              </div>
            </div>
            <div class="mb-3">
              <label for="reorderLevel" class="form-label">Reorder level</label>
              <input type="number" min="0" class="form-control" id="reorderLevel" required />
            </div>
            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description" rows="2" maxlength="1000"></textarea>
            </div>
            <div class="form-check" id="isActiveContainer" style="display: none">
              <input type="checkbox" class="form-check-input" id="isActive" checked />
              <label class="form-check-label" for="isActive">Active</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/pagination.js"></script>
  <script src="assets/js/products.js"></script>
</body>
</html>
