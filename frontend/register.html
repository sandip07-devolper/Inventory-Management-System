<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register · Inventory & Order Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="assets/css/app.css" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Create your organization</h1>
        <p class="text-muted mb-4">Sets up a new tenant and its first Admin user.</p>

        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="companyName" class="form-label">Company name</label>
            <input type="text" class="form-control" id="companyName" required />
          </div>
          <div class="mb-3">
            <label for="adminFullName" class="form-label">Your full name</label>
            <input type="text" class="form-control" id="adminFullName" required />
          </div>
          <div class="mb-3">
            <label for="adminEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="adminEmail" required autocomplete="username" />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <div class="form-text">At least 8 characters.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
